[project]
name = "yandex-oauth"
version = "0.1.0"
description = "Общая OAuth-авторизация Яндекса для CLI-инструментов (ym, ywm, …): keychain, автообновление токена, команда auth"
requires-python = ">=3.11"
authors = [{ name = "bolandau" }]
dependencies = [
    "httpx>=0.27",
    "keyring>=25.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yandex_oauth"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# Текущий уровень покрытия — планка не ниже; поднимать, не опускать.
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]  # assert — смысл теста; фейковые токены — не секреты
