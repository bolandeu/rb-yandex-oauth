[project]
name = "rb-yandex-oauth"
dynamic = ["version"]
description = "Общая OAuth-авторизация Яндекса для CLI-инструментов (ym, ywm, …): keychain, автообновление токена, команда auth"
requires-python = ">=3.11"
authors = [{ name = "bolandau" }]
dependencies = [
    "httpx>=0.27",
    "keyring>=25.0",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "syrupy>=4.8", "ty", "towncrier>=24.8"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

# Версия — из git-тега vX.Y.Z (docs/standard-release.md в tools/), не из этого файла.
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# Команды — не в commands/*.py: их строит make_auth_app (scripts/check_command_docstrings.py).
[tool.cli-generator]
commands = "src/*/auth_command.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yandex_oauth"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# Текущий уровень покрытия — планка не ниже; поднимать, не опускать.
fail_under = 85
show_missing = true

[tool.ty.terminal]
# Гейт валят только ошибки: свежий ty (>= 0.0.84) иначе выходит с 1 и на предупреждениях.
error-on-warning = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]  # assert — смысл теста; фейковые токены — не секреты
"scripts/*" = ["S603", "S607"]  # subprocess с фиксированным argv (git, uv), без shell

[tool.towncrier]
filename = "CHANGELOG.md"
directory = "changelog.d"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
